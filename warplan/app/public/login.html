<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ff5b1f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<title>Sign in · Warplan</title>
<meta name="description" content="Sign in to Warplan, the AI acquisition team.">
</head>
<body class="login-page">
<main class="login-card">
  <div class="brand"><span class="logo" aria-hidden="true"></span><b>WARPLAN</b></div>
  <h1>Plan the takeover.</h1>
  <p class="muted">Josh, the seller simulator, the deal builder, your pipeline and the agents that write your letters, LOIs and board packs.</p>
  <form id="f">
    <div id="setupFields" hidden>
      <p class="ok">First run: create the platform admin login.</p>
      <label for="key">Setup key (the dashboard password)</label>
      <input id="key" type="password" autocomplete="off">
      <label for="name">Your name</label>
      <input id="name" autocomplete="name">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p class="error" id="err" role="alert" hidden></p>
    <button class="primary" type="submit" id="go">Sign in</button>
  </form>
  <p class="muted switch-mode">No login yet? Warplan is invite-only: ask your workspace owner for a link.</p>
</main>
<script src="/login.js"></script>
</body>
</html>
