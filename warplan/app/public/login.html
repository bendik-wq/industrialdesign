<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Warplan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23ff5b1f%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227%22 stroke=%22%23111%22 stroke-width=%222.5%22 fill=%22none%22/%3E%3Cpath d=%22M16 4v8M16 20v8M4 16h8M20 16h8%22 stroke=%22%23111%22 stroke-width=%222.5%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<main class="login-card">
  <div class="brand"><span class="logo"></span><b>WARPLAN</b></div>
  <h1>Plan the takeover.</h1>
  <p class="muted">Josh, the seller simulator, the value ladder and the agents that find, value and finance your next acquisition.</p>
  <form id="f">
    <div id="setupFields" hidden>
      <p class="ok">First run: create the platform admin login.</p>
      <label for="key">Setup key (the dashboard password)</label>
      <input id="key" type="password" autocomplete="off">
      <label for="name">Your name</label>
      <input id="name" autocomplete="name">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p class="error" id="err" hidden></p>
    <button class="primary" type="submit" id="go">Sign in</button>
  </form>
  <p class="muted switch-mode">No login yet? Warplan is invite-only.</p>
</main>
<script src="/login.js"></script>
</body>
</html>
