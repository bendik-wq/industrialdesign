<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ff5b1f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<title>Join · Warplan</title>
<meta name="description" content="Accept your invite to Warplan.">
</head>
<body class="login-page">
<main class="login-card">
  <div class="brand"><span class="logo" aria-hidden="true"></span><b>WARPLAN</b></div>
  <h1 id="h">You're invited.</h1>
  <p class="muted" id="sub">Checking your invite…</p>
  <form id="f" hidden>
    <label for="name">Your name</label>
    <input id="name" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pw">Choose a password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="10" required>
    <p class="muted small">At least 10 characters.</p>
    <p class="error" id="err" role="alert" hidden></p>
    <button class="primary" type="submit" id="go">Join the workspace</button>
  </form>
  <p class="muted switch-mode">Already have a login? <a href="/login">Sign in</a></p>
</main>
<script src="/join.js"></script>
</body>
</html>
