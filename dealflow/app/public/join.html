<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join · Dealflow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230f5c4d%22/%3E%3Cpath d=%22M9 21l5-5 4 3 6-8%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<main class="login-card">
  <div class="brand"><span class="logo"></span><b>Dealflow</b></div>
  <h1 id="title">Join your team on Dealflow.</h1>
  <p class="muted" id="sub">Checking your invite…</p>
  <form id="f" hidden>
    <label for="name">Your name</label>
    <input id="name" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pw">Choose a password (10+ characters)</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="10" required>
    <p class="error" id="err" hidden></p>
    <button class="primary" type="submit">Create login</button>
  </form>
</main>
<script src="/join.js"></script>
</body>
</html>
