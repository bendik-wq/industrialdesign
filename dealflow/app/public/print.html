<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letters · Dealflow</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #e9e7e2; font: 15px/1.6 Georgia, "Times New Roman", serif; color: #111; }
  .bar { position: sticky; top: 0; display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #0f5c4d; color: #fff; font: 14px system-ui, sans-serif; }
  .bar button { font: 600 14px system-ui; background: #fff; color: #0f5c4d; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .page { width: 210mm; min-height: 297mm; margin: 20px auto; background: #fff; padding: 28mm 24mm; box-shadow: 0 4px 20px rgb(0 0 0 / .12); }
  .addr { margin-bottom: 18mm; font-size: 14px; }
  .date { text-align: right; margin-bottom: 10mm; color: #444; }
  .body { white-space: pre-wrap; }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .page { margin: 0; box-shadow: none; page-break-after: always; }
  }
</style>
</head>
<body>
<div class="bar"><span id="status">Preparing letters…</span><span style="flex:1"></span><button id="printBtn" type="button">Print / save as PDF</button></div>
<div id="pages"></div>
<script type="module" src="/print.js"></script>
</body>
</html>
