</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="logo"><i></i>Funnel HQ</div>
      <button type="button" class="jump-btn" data-jump aria-label="Jump to a tab or action" aria-keyshortcuts="Control+K Meta+K"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="jump-label">Jump to…</span><kbd>Ctrl K</kbd></button>
      <button type="button" class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="side-menu"><span aria-hidden="true">☰</span> <span data-nav-current>Overview</span></button>
      <div class="side-menu" id="side-menu">
        <form class="nav-search" data-nav-search role="search"><input type="search" name="q" placeholder="Find a lead…  /" aria-label="Find a lead by name, email, phone or ref" autocomplete="off"></form>
        <nav data-nav aria-label="Dashboard sections">
          <div class="nav-group"><p class="nav-h">Command</p>
            <button data-tab="command">Command <span class="nav-badge" data-nav-badge="command" hidden></span></button>
          </div>
          <div class="nav-group"><p class="nav-h">Today</p>
            <button data-tab="overview" aria-current="page">Overview</button>
            <button data-tab="live">Live <span class="live-dot" aria-hidden="true"></span></button>
          </div>
          <div class="nav-group"><p class="nav-h">Sell</p>
            <button data-tab="leads">Leads</button>
            <button data-tab="dminbox">DM inbox</button>
            <button data-tab="sales">Calls &amp; deals <span class="nav-badge" data-nav-badge="sales" hidden></span></button>
            <button data-tab="salesops">Follow-up actions</button>
            <button data-tab="clients">Clients</button>
            <button data-tab="insights">Best leads</button>
            <button data-tab="finance">Financial model</button>
          </div>
          <div class="nav-group"><p class="nav-h">Contracts</p>
            <button data-tab="contracts">Agreements</button>
          </div>
          <div class="nav-group"><p class="nav-h">Funnel</p>
            <button data-tab="map">Funnel maps</button>
            <button data-tab="screens">Page previews</button>
            <button data-tab="pages">Landing pages &amp; tests</button>
            <button data-tab="vsl">Video (VSL)</button>
            <button data-tab="application">Application</button>
            <button data-tab="behaviour">On-page behaviour</button>
          </div>
          <div class="nav-group"><p class="nav-h">Traffic</p>
            <button data-tab="search">Search &amp; AI</button>
            <button data-tab="content">Content</button>
            <button data-tab="ytideas">YouTube ideas</button>
            <button data-tab="traffic">Traffic &amp; ads</button>
            <button data-tab="autopilot">Ads autopilot</button>
            <button data-tab="audiences">Meta audiences</button>
            <button data-tab="links">Links &amp; videos</button>
            <button data-tab="webinar">Webinar</button>
            <button data-tab="liveevents">Live webinars</button>
            <button data-tab="rooms">Rooms</button>
            <button data-tab="dealsprint">Sprint board</button>
            <button data-tab="materials">Materials</button>
            <button data-tab="challenge">Challenge</button>
            <button data-tab="wattrib">Webinar attribution</button>
            <button data-tab="research">Research</button>
          </div>
          <div class="nav-group"><p class="nav-h">Follow-up</p>
            <button data-tab="support">Support</button>
            <button data-tab="emails">Emails</button>
            <button data-tab="editor">Email editor</button>
            <button data-tab="reactivation">Reactivation</button>
            <button data-tab="winback">Win-back</button>
            <button data-tab="sms">SMS &amp; WhatsApp</button>
            <button data-tab="voice">AI calls</button>
          </div>
          <div class="nav-group"><p class="nav-h">Setup</p>
            <button data-tab="team">Reps &amp; routing</button>
            <button data-tab="integrations">Integrations</button>
            <button data-tab="tracking">Ad tracking</button>
            <button data-tab="errors">Errors &amp; cron</button>
          </div>
        </nav>
        <div class="foot">
          <a class="btn-sm ghost" href="/" target="_blank" rel="noopener">Open funnel ↗</a>
          <button type="button" data-theme-toggle>Theme: auto</button>
          <form method="post" action="/admin/logout"><button type="submit" style="width:100%">Log out</button></form>
        </div>
      </div>
    </aside>
    <main class="content">
      <header class="hq-bar" data-hq-bar>
        <p class="hq-bar-title" data-bar-title aria-hidden="true"></p>
        <div class="filters" data-filters>
          <div class="seg" role="group" aria-label="Date range" data-range>
            <button data-days="1">Today</button>
            <button data-days="7">7 days</button>
            <button data-days="30" aria-pressed="true">30 days</button>
            <button data-days="90">90 days</button>
            <button data-days="3650">All time</button>
          </div>
          <select data-filter="channel" aria-label="Channel"><option value="">All channels</option></select>
          <select data-filter="campaign" aria-label="Campaign"><option value="">All campaigns</option></select>
          <select data-filter="variant" aria-label="Headline variant"><option value="">All variants</option></select>
          <select data-filter="device" aria-label="Device"><option value="">All devices</option><option value="mobile">Mobile</option><option value="desktop">Desktop</option><option value="tablet">Tablet</option></select>
          <button class="clear" type="button" data-clear>Reset</button>
        </div>
        <button type="button" class="bar-search" data-jump aria-label="Jump to a tab or action" aria-keyshortcuts="Control+K Meta+K"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="jump-label">Search</span><kbd>Ctrl K</kbd></button>
      </header>
      <div class="page-head">
        <div><p class="eyebrow" data-eyebrow>Today</p><h1 data-title>Overview</h1><p data-subtitle></p><details class="page-more" data-more hidden><summary>How this works</summary><p data-more-text></p></details></div>
      </div>
      <div class="view" data-view></div>
    </main>
  </div>
</body>
</html>
