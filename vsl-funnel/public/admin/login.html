<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard login</title>
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <div class="login">
    <form method="post" action="/admin/login">
      <h1>Funnel dashboard</h1>
      <p class="muted" style="margin:0">Enter the admin password to continue.</p>
      <p class="err" id="err" hidden></p>
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus aria-label="Password">
      <button class="btn-sm" type="submit">Log in</button>
    </form>
  </div>
  <script>
    var e = new URLSearchParams(location.search).get('error');
    var msg = { wrong: 'Wrong password', tooMany: 'Too many attempts. Wait 15 minutes and try again.', tooManyAll: 'Sign-in is paused after many wrong passwords. Try again within the hour.', setup: 'Set the ADMIN_PASSWORD secret first: npx wrangler secret put ADMIN_PASSWORD' };
    if (e) { var el = document.getElementById('err'); el.textContent = Object.prototype.hasOwnProperty.call(msg, e) ? msg[e] : 'Login failed'; el.hidden = false; }
  </script>
</body>
</html>
