<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  <title>See if you qualify</title>
  <script defer src="/assets/f.js"></script>
  <script defer src="/assets/apply.js"></script>
</head>
<body>
  <header class="nav"><div class="wrap nav-in">
    <a class="logo" href="/" aria-label="G&amp;L M&amp;A Advisory home"><b>G&amp;L</b> <span>M&amp;A Advisory</span></a>
    <a class="btn btn-sm nav-cta" href="/#apply" data-track="cta_click" data-track-id="nav"><span class="long">See if you qualify</span><span class="short">Apply</span></a>
  </div></header>
  <main id="main" class="hero compact">
    <section class="apply-section" id="apply">
      <div class="wrap apply-grid">
        <div class="apply-copy">
          <h2 class="section-title" data-slot="apply_title">See if your business qualifies</h2>
          <p class="section-sub" data-slot="apply_subtitle"></p>
          <ul class="ticks" data-list="apply_points"></ul>
          <p class="guarantee" data-slot="guarantee"></p>
        </div>
        <div class="form-card">
          <div class="app-progress" aria-hidden="true"><i data-progress></i></div>
          <div class="app-meta"><span data-step-label>Step 1</span><span data-time-left></span></div>
          <form data-app novalidate autocomplete="on"><noscript><p class="form-error">Please enable JavaScript to complete the application.</p></noscript></form>
          <div data-turnstile></div>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <div class="wrap">
      <div class="foot-grid">
        <div class="foot-links"><a href="/privacy">Privacy</a><a href="/privacy#terms">Terms</a><a href="/#faq">FAQ</a></div>
        <div class="foot-legal"><p data-slot="disclaimer"></p><p data-slot="consent"></p></div>
      </div>
      <p class="foot-bottom">© <span data-slot="year"></span> <span data-slot="site_name">G&amp;L M&amp;A Advisory</span></p>
    </div>
  </footer>
</body>
</html>
