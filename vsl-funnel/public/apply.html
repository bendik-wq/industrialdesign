<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apply</title>
  <meta name="theme-color" content="#0b0b0c">
  <link rel="stylesheet" href="/assets/site.css">
  <script defer src="/assets/f.js"></script>
  <script defer src="/assets/apply.js"></script>
</head>
<body>
  <div class="topbar">Strategy call application · Takes about 2 minutes</div>
  <div class="brand"><span data-slot="site_name">G&amp;L M&amp;A Advisory</span></div>
  <main class="app" id="main">
    <div class="app-progress" aria-hidden="true"><i data-progress></i></div>
    <div class="app-meta"><span data-step-label>Step 1</span><span data-time-left></span></div>
    <form data-app novalidate autocomplete="on">
      <noscript><p class="form-error">Please enable JavaScript to complete the application.</p></noscript>
    </form>
    <div data-turnstile></div>
    <p class="privacy-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Your answers are private and only used to prepare your call.
    </p>
  </main>
  <footer>
    <div class="wrap">
      <nav><a href="/privacy">Privacy</a></nav>
      <p data-slot="disclaimer"></p>
    </div>
  </footer>
</body>
</html>
