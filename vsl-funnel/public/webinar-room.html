<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/sprint.css">
  <title>Masterclass</title>
  <script defer src="/assets/f.js"></script>
  <script defer src="/assets/live-player.js"></script>
  <script defer src="/assets/webinar.js"></script>
  <script defer src="/assets/webinar-room.js"></script>
  <script defer src="/assets/webinar-experience.js"></script>
  <script defer src="/assets/webinar-live.js"></script>
  <script defer src="/assets/webinar-sprint.js"></script>
</head>
<body class="webinar rm-body">
  <header class="nav rm-nav"><div class="wrap nav-in">
    <a class="logo" href="/" aria-label="G&amp;L M&amp;A Advisory"><b>G&amp;L</b> <span>M&amp;A Advisory</span></a>
    <p class="rm-meta"><span data-slot="room_label">Masterclass</span><span data-if="pass_active"> · <span class="pass-badge" data-slot="pass_badge">Paid</span></span></p>
  </div></header>
  <main id="main" class="rm">
    <div class="wrap rm-wrap">
      <header class="rm-head">
        <h1 class="rm-title" data-slot="webinar_title">The masterclass</h1>
        <p class="rm-when" data-slot="when"></p>
      </header>
      <div class="live-banner" data-live-banner role="status" aria-live="polite" hidden></div>
      <div class="rm-grid">
        <div class="rm-main">
          <div class="room-stage" data-room>
            <div class="room-wait" data-wait>
              <p class="lede">Welcome<span data-slot="first_name_comma"></span>. We start in</p>
              <div class="countdown big" data-countdown aria-live="polite"></div>
              <p class="muted">Keep this page open. It starts by itself.</p>
            </div>
            <div class="room-video" data-video hidden></div>
            <div class="room-live" data-live hidden>
              <p class="lede">The session is on now.</p>
              <a class="btn btn-lg" href="#" data-join>Join the live session</a>
            </div>
            <div class="room-ended" data-ended hidden>
              <p class="lede">That’s the end of the session. Thanks for watching.</p>
            </div>
          </div>
          <p class="live-presence" data-live-presence aria-live="polite" hidden></p>
          <div class="rm-catch" data-catch hidden></div>
          <p class="rm-lockline" data-offer-line hidden></p>
          <section class="rm-now" data-now aria-label="Now in the masterclass">
            <div class="now-idle" data-now-idle></div>
          </section>
          <div class="room-cta" data-cta hidden></div>
          <div class="room-pass" data-pass></div>
          <p class="muted small rm-replay" data-if="replay">This replay is available until <span data-replay-until></span>.</p>
        </div>
        <aside class="rm-side" data-side aria-label="Room tools">
          <div class="rm-sheet-head"><strong>Room</strong><button type="button" class="rm-sheet-x" data-sheet-close aria-label="Close">×</button></div>
          <div class="rm-tabs" role="tablist" aria-label="Room tools" data-tabs></div>
          <div class="rm-panes">
            <div class="rm-pane" role="tabpanel" data-pane="deal" hidden><div class="rm-dealmoved" data-deal-moved></div><div class="wx-panel" data-wx-panel hidden></div></div>
            <div class="rm-pane" role="tabpanel" data-pane="ask" hidden><div class="room-ask" data-ask></div><div class="live-raise" data-live-raise hidden></div></div>
            <div class="rm-pane" role="tabpanel" data-pane="chat" hidden><section class="live-chat" data-live-chat aria-label="Showing chat" hidden></section></div>
            <div class="rm-pane" role="tabpanel" data-pane="chapters" hidden><nav class="room-agenda" data-agenda aria-label="Masterclass chapters"></nav></div>
            <div class="rm-pane" role="tabpanel" data-pane="notes" hidden><section class="wx-notes" data-wx-notes></section></div>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <nav class="rm-dock" data-dock aria-label="Room tools"></nav>
  <div class="rm-scrim" data-scrim hidden></div>
  <footer>
    <div class="wrap">
      <div class="foot-grid">
        <div class="foot-links"><a href="/privacy">Privacy</a><a href="/privacy#terms">Terms</a></div>
        <div class="foot-legal"><p data-slot="disclaimer"></p></div>
      </div>
      <p class="foot-bottom">© <span data-slot="year"></span> <span data-slot="site_name">G&amp;L M&amp;A Advisory</span></p>
    </div>
  </footer>
</body>
</html>
